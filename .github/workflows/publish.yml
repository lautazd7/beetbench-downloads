name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rebuild and verify installer
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const manifest = JSON.parse(fs.readFileSync("installer.json", "utf8"));
          fs.mkdirSync("dist", { recursive: true });
          const output = path.join("dist", manifest.file);
          const handle = fs.openSync(output, "w");
          const hash = crypto.createHash("sha256");

          try {
            for (const part of manifest.parts) {
              if (path.basename(part) !== part) throw new Error(`Invalid part: ${part}`);
              const data = fs.readFileSync(path.join("parts", part));
              hash.update(data);
              fs.writeSync(handle, data);
            }
          } finally {
            fs.closeSync(handle);
          }

          const actualHash = hash.digest("hex");
          const actualSize = fs.statSync(output).size;
          if (actualHash !== manifest.sha256 || actualSize !== manifest.size) {
            throw new Error(`Installer verification failed: ${actualSize} bytes, ${actualHash}`);
          }
          console.log(`Verified ${output}: ${actualSize} bytes, ${actualHash}`);
          NODE

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node -p 'require("./installer.json").tag')"
          file="$(node -p 'require("./installer.json").file')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$file" --clobber
          else
            gh release create "$tag" "dist/$file" \
              --title "BeetBench 0.1.0" \
              --notes "Windows x64 installer. This initial build is unsigned; Windows SmartScreen may show a warning." \
              --latest
          fi
